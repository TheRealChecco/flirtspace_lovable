services:
  web:
    # Node (not Bun): Bun's built-in `undici` shim is missing dispatch()/close()/
    # destroy() on Pool (https://github.com/oven-sh/bun/issues/39247), which breaks
    # the miniflare runtime used by @cloudflare/vite-plugin. Node ships a working
    # undici, so the Cloudflare/TanStack Start dev server boots cleanly.
    build:
      context: .
      dockerfile: Dockerfile.base44
    image: node22-base44:latest
    working_dir: /app
    volumes:
      - ./:/app
      # keep installed deps out of the host bind-mount for speed/reproducibility
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults   # placeholders so the app boots without credentials
      - /run/base44/app.env       # platform-managed secrets — always wins
    environment:
      # pass the preview suffix so the dev server can allow the external origin
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    # Generates .dev.vars (gitignored) from the OS env so the workerd SSR
    # runtime sees server secrets via process.env (workerd ignores OS env).
    command: sh scripts/dev-base44.sh
    restart: unless-stopped

volumes:
  node_modules:
